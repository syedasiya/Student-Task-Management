services:
  - type: web
    name: tandem-student-task-manager
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: StudentTaskDB
      - key: JWT_SECRET
        generateValue: true